name: Native correctness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned toolchain
        run: rustup toolchain install 1.63.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.63.0 fmt --all -- --check
      - name: Tests (including offline synthetic discovery and sealed replay)
        run: cargo +1.63.0 test --locked --offline
      - name: Record exercised SIMD backend
        run: cargo +1.63.0 test --locked --offline kernels::tests::simd_matches_scalar_boundaries -- --nocapture
      - name: Lint
        run: cargo +1.63.0 clippy --locked --offline --all-targets -- -D warnings
      - name: Release build
        run: cargo +1.63.0 build --release --locked --offline
      - name: Adapter syntax
        run: python3 -m py_compile scripts/*.py
      - name: Independent geometry domain and qualifier reference
        run: python3 scripts/verify_geometry.py --self-test
      - name: Independent direction experiment and leakage checks
        run: |
          python3 -m venv "$RUNNER_TEMP/filang-direction-verify"
          "$RUNNER_TEMP/filang-direction-verify/bin/python" -m pip install -r requirements-verify.txt
          "$RUNNER_TEMP/filang-direction-verify/bin/python" scripts/test_direction_analysis.py
      - name: Geometry information experiment and causal ledger
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          "$RUNNER_TEMP/filang-direction-verify/bin/python" -m pip install -r requirements-information.txt
          "$RUNNER_TEMP/filang-direction-verify/bin/python" -m unittest discover -s experiments/geometry_information/tests -v
