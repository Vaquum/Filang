name: Native correctness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned toolchain
        run: rustup toolchain install 1.63.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.63.0 fmt --all -- --check
      - name: Tests (including offline synthetic discovery and sealed replay)
        run: cargo +1.63.0 test --locked --offline
      - name: Record exercised SIMD backend
        run: cargo +1.63.0 test --locked --offline kernels::tests::simd_matches_scalar_boundaries -- --nocapture
      - name: Lint
        run: cargo +1.63.0 clippy --locked --offline --all-targets -- -D warnings
      - name: Release build
        run: cargo +1.63.0 build --release --locked --offline
      - name: Adapter syntax
        run: python3 -m py_compile scripts/*.py
      - name: Independent geometry domain and qualifier reference
        run: python3 scripts/verify_geometry.py --self-test
      - name: Independent direction experiment and leakage checks
        run: |
          python3 -m venv "$RUNNER_TEMP/filang-direction-verify"
          "$RUNNER_TEMP/filang-direction-verify/bin/python" -m pip install -r requirements-verify.txt
          "$RUNNER_TEMP/filang-direction-verify/bin/python" scripts/test_direction_analysis.py
      - name: Geometry information experiment and causal ledger
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          "$RUNNER_TEMP/filang-direction-verify/bin/python" -m pip install -r requirements-information.txt
          "$RUNNER_TEMP/filang-direction-verify/bin/python" -m unittest discover -s experiments/geometry_information/tests -v
      - name: Filang query workspace and native parity on recorded BTCUSDT
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location --retry 2 -o "$RUNNER_TEMP/filang-study.parquet" https://raw.githubusercontent.com/Vaquum/Limen/383d4accbfa20fe062cd09de83e265886542aa8f/tests/fixtures/spot_15m_20250101_20250531.parquet
          curl --fail --silent --show-error --location --retry 2 -o "$RUNNER_TEMP/filang-composer-bars.py" https://raw.githubusercontent.com/Vaquum/Composer/133e3017ba9143f7dc255df7218ff7bfe46d9d06/bars.py
          python3 -m venv "$RUNNER_TEMP/filang-study-python"
          "$RUNNER_TEMP/filang-study-python/bin/python" -m pip install polars==1.42.1 pyarrow==23.0.1
          "$RUNNER_TEMP/filang-study-python/bin/python" study/prepare_recording.py --parquet "$RUNNER_TEMP/filang-study.parquet" --encoder "$RUNNER_TEMP/filang-composer-bars.py"
          npm --prefix study run verify
          node study/verify/native.mjs
          node study/verify/candle-native.mjs
          node query/verify/handoff.mjs
