name: pr_checks_experiment

# Law 1 only. PR metadata is JSON, never interpolated into shell code.
# No path/author/label/draft skips: incomplete records remain red.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_checks_experiment:
    name: pr_checks_experiment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test the gate and its policy/template/workflow contracts
        run: python -m unittest discover -s governance/tests -v
      - name: Fetch current PR metadata and every changed path
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/experiment-record"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/experiment-record/pr.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/experiment-record/files.json"
      - name: Require the complete checked experiment record
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python governance/experiment_gate.py \
            --pr-json "$RUNNER_TEMP/experiment-record/pr.json" \
            --files-json "$RUNNER_TEMP/experiment-record/files.json" \
            --expected-head "$EXPECTED_HEAD" \
            --report "$RUNNER_TEMP/experiment-record/gate-report.json"
      - name: Retain the evaluated PR snapshot and gate verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experiment-record-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/experiment-record/
          if-no-files-found: error
          retention-days: 90
