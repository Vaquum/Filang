name: Deploy Query
# Puts the query bench on the Origo host, where the host's Caddy (deployed from Vaquum/Portal) serves it as
# query.vaquum.fi behind the Portal login. The pattern is Composer's: sync the sources, build on the host, start.
on:
  push:
    branches: [main]
    paths:
      - 'query/**'
      - 'bindings/fetch_browser.py'
      - 'study/data-provenance.json'
      - 'study/recording-lock.json'
      - 'study/prepare_recording.py'
      - '.github/workflows/deploy-query.yml'
  workflow_dispatch:
# Never cancel a deploy half way: a newer push waits, and the last commit pushed is deployed next.
concurrency:
  group: deploy-query
permissions:
  contents: read
jobs:
  deploy:
    name: Sync to the Origo host and start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The host and its deploy key: the organisation's TDW secrets once they are shared with this repository,
    # or else this repository's DEPLOY_SSH_KEY with its DEPLOY_HOST and DEPLOY_USER variables.
    env:
      DEPLOY_HOST: ${{ secrets.TDW_IP || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.TDW_USER || vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.QUERY_DEPLOY_DIR || '/opt/query' }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      # Not 8491: on this host that is Cube's field-data service. Vaquum/Portal's Caddyfile names the same port.
      QUERY_PORT: '8493'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: The bench and its server parse
        run: |
          set -euo pipefail
          for file in query/serve.mjs query/cube.mjs query/calendar.mjs query/bench/*.js query/shared/*.js; do node --check "$file"; done
      - name: Validate deploy configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_DIR"
          test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Configure SSH with the host key pinned
        env:
          DEPLOY_KEY: ${{ secrets.TDW_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::No deploy key: share the organisation's TDW secrets with this repository, or set its DEPLOY_SSH_KEY."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # the host must present the key pinned in DEPLOY_KNOWN_HOSTS, whatever address names it
          pinned=$(printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | awk '{print $2" "$3}')
          scanned=$(ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null | awk '{print $2" "$3}')
          test -n "$scanned"
          test "$scanned" = "$pinned"
          printf '%s %s\n' "$DEPLOY_HOST" "$pinned" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Refuse a port that another service holds
        run: |
          set -euo pipefail
          # Query was first given a port on a guess. It was another service's: Query could not bind it, and the
          # health check was answered by that service. So before anything is changed on the host, the port
          # must be free or already answering as Query. An unreadable answer counts as taken.
          # shellcheck disable=SC2029
          state=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "QUERY_PORT=$QUERY_PORT bash -s" <<'REMOTE'
          set -u
          command -v ss >/dev/null || { echo unknown; exit 0; }
          # ss failing, with or without output, is an unreadable answer: only a successful empty listing is free.
          listening=$(ss -ltnH "sport = :$QUERY_PORT") || { echo unknown; exit 0; }
          if [ -z "$listening" ]; then echo free
          elif curl -s --max-time 10 "http://127.0.0.1:$QUERY_PORT/healthz" | grep -q '"service":"filang-query"'; then echo query
          else echo taken
          fi
          REMOTE
          )
          echo "port $QUERY_PORT is: $state"
          test "$state" = free || test "$state" = query
      - name: Sync what the image is built from
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR'"
          rsync -az --delete --relative \
            query bindings/fetch_browser.py \
            study/data-provenance.json study/recording-lock.json study/prepare_recording.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
      - name: Build and start
        run: |
          # DEPLOY_DIR is expanded here, on purpose, and sent quoted. The build recreates the pinned recording
          # from its public sources and fails if a single byte differs from the published digests.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR/query' && docker compose up -d --build --remove-orphans && docker compose ps"
      - name: Check that it is Query that answers
        run: |
          set -euo pipefail
          # A 200 is not enough: the container must be running without a restart, and the answer must name Query.
          # Another Query instance on the port answers the same way, so the container must also have bound the port
          # itself, and all of it must hold over consecutive samples spanning at least ten seconds: a container that
          # cannot bind exits and is restarted within that time, which its restart count then shows.
          check() {
            # shellcheck disable=SC2029
            ssh "$DEPLOY_USER@$DEPLOY_HOST" "QUERY_PORT=$QUERY_PORT DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -u
          cd "$DEPLOY_DIR/query" || exit 1
          id=$(docker compose ps -q query)
          test -n "$id" || { echo "no container"; exit 1; }
          state=$(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' "$id")
          body=$(curl -s --max-time 10 "http://127.0.0.1:$QUERY_PORT/healthz" || true)
          echo "$state $body"
          test "$state" = "running restarts=0" || exit 1
          # serve.mjs prints this line only once it is listening, so it cannot come from an instance that lost the port.
          docker logs "$id" 2>&1 | grep -qF "Filang query bench on http://127.0.0.1:$QUERY_PORT/" || { echo "this container is not listening on $QUERY_PORT"; exit 1; }
          printf '%s' "$body" | grep -q '"service":"filang-query"' || exit 1
          printf '%s' "$body" | grep -q '"ok":true' || exit 1
          REMOTE
          }
          held=0
          for _ in $(seq 1 24); do
            if check; then held=$((held + 1)); else held=0; fi
            # three passes five seconds apart: the answer has held for at least ten seconds
            if [ "$held" -ge 3 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Query did not come up as itself on port $QUERY_PORT."
          exit 1
      - name: Say whether the cube's bars are reaching it
        run: |
          set -euo pipefail
          # The bench stands without the cube: it shows its built-in recording and says so. So this does not fail
          # the deploy; it says which of the two the site is serving, where a reader of this log can see it.
          # shellcheck disable=SC2029
          answer=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl -s --max-time 120 'http://127.0.0.1:$QUERY_PORT/bars?w=24h' | head -c 2000" || true)
          if printf '%s' "$answer" | grep -q '"source":"cube"'; then
            echo "cube bars: $(printf '%s' "$answer" | grep -o '"row_count":[0-9]*') $(printf '%s' "$answer" | grep -o '"through":"[^"]*"') $(printf '%s' "$answer" | grep -o '"canonical_through":[^,]*')"
          else
            echo "::warning::Query is up but is not getting bars from the cube: $(printf '%s' "$answer" | head -c 300)"
          fi
      - name: Say whether field-data-api's NYSE calendar is reaching it
        run: |
          set -euo pipefail
          # Without it the cube windows are asked with the engine's pinned table, whose days lie outside them, so their
          # session conditions are unknown. That does not fail the deploy either; it is said here.
          # shellcheck disable=SC2029
          answer=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl -s --max-time 60 'http://127.0.0.1:$QUERY_PORT/calendar/nyse' | head -c 4000" || true)
          if printf '%s' "$answer" | grep -q '"source":"field-data-api"'; then
            echo "NYSE calendar: $(printf '%s' "$answer" | grep -o '"table":"[^"]*"') $(printf '%s' "$answer" | grep -o '"coverage":{[^}]*}') $(printf '%s' "$answer" | grep -o '"sessions":[0-9]*')"
          else
            echo "::warning::Query is up but is not getting its NYSE calendar from field-data-api: $(printf '%s' "$answer" | head -c 300)"
          fi
