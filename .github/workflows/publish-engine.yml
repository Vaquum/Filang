name: Publish engine packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, tomllib
          with open("Cargo.toml", "rb") as source:
              base = tomllib.load(source)["package"]["version"]
          print(f"version={base}.post{os.environ['RELEASE_NUMBER']}")
          PY

  browser:
    needs: version
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build browser package
        run: |
          python3 -m unittest discover -s bindings/verify -p 'test_*.py' -v
          rustup target add wasm32-unknown-unknown --toolchain stable
          python3 bindings/build.py --only browser --version "$RELEASE_VERSION"
          node bindings/verify/package.mjs "$RELEASE_VERSION"
          tar -C target/engine-dist -czf "target/engine-dist/filang-browser-$RELEASE_VERSION.tar.gz" browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser
          path: target/engine-dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build Linux x86_64 wheel in manylinux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io" -e RELEASE_VERSION \
            quay.io/pypa/manylinux_2_28_x86_64:latest bash -euc '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.63.0
              export PATH="$HOME/.cargo/bin:$PATH"
              cd /io
              /opt/python/cp310-cp310/bin/python bindings/build.py --only wheel --version "$RELEASE_VERSION"
              auditwheel repair --plat manylinux_2_28_x86_64 target/engine-dist/*.whl -w wheelhouse
            '
      - name: Build macOS Apple silicon wheel
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install 1.63.0 --profile minimal
          python3 bindings/build.py --only wheel --native-toolchain 1.63.0 --version "$RELEASE_VERSION" --out wheelhouse
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Verify installed wheel on Python 3.10
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links wheelhouse "filang==$RELEASE_VERSION"
          python bindings/verify/package.py "$RELEASE_VERSION"
          python bindings/verify/vectors.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify installed wheel on Python 3.13
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links wheelhouse "filang==$RELEASE_VERSION"
          python bindings/verify/package.py "$RELEASE_VERSION"
          python bindings/verify/vectors.py
          python -m pip install twine
          python -m twine check wheelhouse/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, browser, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/filang/
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser
          path: browser
      - name: Publish wheels to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
      - name: Publish versioned browser assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd browser
          sha256sum ./*.tar.gz | sed 's|  ./|  |' > SHA256SUMS
          tag="v$RELEASE_VERSION"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$RELEASE_COMMIT" --title "Filang $RELEASE_VERSION" \
              --notes "Engine ABI 1. Python: pip install filang==$RELEASE_VERSION. Browser: filang-browser-$RELEASE_VERSION.tar.gz; verify with SHA256SUMS." \
              ./*.tar.gz SHA256SUMS
          fi

  verify-published:
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify public index installation and hash locking
        run: |
          python -m pip install uv
          printf 'filang==%s\n' "$RELEASE_VERSION" > "$RUNNER_TEMP/filang.in"
          # The upload can succeed before the version reaches the simple index.
          for attempt in 1 2 3 4 5 6; do
            if uv --no-cache pip compile --generate-hashes "$RUNNER_TEMP/filang.in" -o "$RUNNER_TEMP/filang.txt"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 15
          done
          python -m pip install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/filang.txt"
          python bindings/verify/package.py "$RELEASE_VERSION"
          python bindings/verify/vectors.py
      - name: Verify public browser download
        run: |
          python3 bindings/fetch_browser.py "$RELEASE_VERSION" --out target/engine-dist/browser
          node bindings/verify/package.mjs "$RELEASE_VERSION"
