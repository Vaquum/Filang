<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filang query</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/bench/bench.css">
</head>
<body class="bench night">
  <header class="topbar">
    <span class="word">Filang</span>
    <nav class="tabs aspects" aria-label="Aspects of the tool"><a id="to-cube" target="_blank" rel="noopener">Cube ↗</a><a id="to-composer" target="_blank" rel="noopener">Composer ↗</a><span aria-current="page">Query</span></nav>
    <div id="readout" class="readout" aria-live="polite"></div>
    <div class="tabs toggles" role="toolbar" aria-label="Panels">
      <button type="button" data-panel="left" title="Pattern catalogue · P">Patterns</button>
      <button type="button" data-panel="cases" title="Recorded closes of the selected row · C">Cases</button>
      <button type="button" data-panel="tape" title="The recorded tape · T">Tape</button>
      <button type="button" data-panel="query" title="The formal query · Q">Query</button>
      <button type="button" data-panel="limen" title="Hand this question to Limen · L">Limen</button>
      <button type="button" data-panel="right" title="Inspect the selected row or close · I">Inspect</button>
    </div>
  </header>
  <div id="encbar" class="encbar" role="toolbar" aria-label="What the canvas shows"></div>
  <div class="work">
    <aside id="left" class="side" aria-label="Patterns" hidden></aside>
    <div class="main">
      <section id="canvas" class="canvas" aria-label="Pattern canvas">
        <div class="axis row3"><div class="lab"><span id="rowlabel" class="note"></span><span id="pager" class="pagerbar"></span></div><div id="axis"></div><div id="trackhead" class="cols label"></div></div>
        <div id="lanes"><div class="cursor" id="cursor"></div><div class="tip" id="tip"></div></div>
        <div class="band row3">
          <label class="cell"><span class="plus" aria-hidden="true">+</span><input id="add" type="text" autocomplete="off" spellcheck="false" aria-label="Add a condition" placeholder="Add a condition"></label>
          <div id="coltrack"></div>
          <div id="collabel" class="lab"></div>
        </div>
      </section>
      <section id="drawer" class="drawer" hidden></section>
    </div>
    <aside id="right" class="side right" aria-label="Inspect" hidden></aside>
  </div>
  <footer class="foot">
    <span id="chip"></span>
    <span class="keys">
      <span class="key"><svg width="9" height="14"><line x1="4.5" x2="4.5" y1="0" y2="14" stroke="#AAB3BD"/><rect x="1.5" y="3.5" width="6" height="6" fill="#142038" stroke="#AAB3BD"/></svg>Median candle, up</span>
      <span class="key"><svg width="9" height="14"><line x1="4.5" x2="4.5" y1="0" y2="14" stroke="#AAB3BD"/><rect x="1.5" y="3.5" width="6" height="6" fill="#AAB3BD" stroke="#AAB3BD"/></svg>Down</span>
      <span class="key"><svg width="16" height="10"><rect width="16" height="10" fill="#F7F6F2" fill-opacity=".14"/></svg>Middle half of closes</span>
      <span class="key"><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="#AAB3BD" stroke-dasharray="2 4"/></svg>Anchor close</span>
      <span class="key"><svg width="8" height="6"><path d="M0 0H8L4 6Z" fill="#AAB3BD"/></svg>Measured horizon</span>
    </span>
    <span id="status"></span>
  </footer>
  <script type="module">
    // The bench answers nothing without the engine: a page that cannot load it says so.
    import('/bench/bench.js').catch((e) => { console.error(e); const s = document.getElementById('status'); s.textContent = 'The bench could not start: ' + e.message; s.className = 'err'; });
  </script>
</body>
</html>
