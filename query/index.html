<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filang query</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- the surface, navy or warm stock, is set before anything is drawn -->
  <script src="/shared/surface.js"></script>
  <link rel="stylesheet" href="/shared/surface.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/bench/bench.css">
</head>
<body class="bench night">
  <header class="topbar">
    <span class="word">Filang</span>
    <nav class="tabs aspects" aria-label="Aspects of the tool"><a id="to-cube" target="_blank" rel="noopener">Cube ↗</a><a id="to-composer" target="_blank" rel="noopener">Composer ↗</a><span aria-current="page">Query</span></nav>
    <div id="readout" class="readout" aria-live="polite"></div>
    <button type="button" class="surface-toggle" data-surface-toggle><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5.5"/><path d="M6 .5a5.5 5.5 0 0 1 0 11Z"/></svg><span data-surface-word>Auto</span></button>
  </header>
  <!-- Each panel's switch sits on the edge it opens from: the catalogue on the left, Inspect on the right, the drawer's tabs on the drawer. -->
  <div class="encrow">
    <button type="button" class="edge" data-panel="left" aria-label="Patterns" title="Pattern catalogue" aria-keyshortcuts="P" disabled><svg class="side-icon" width="14" height="10" aria-hidden="true"><rect x=".5" y=".5" width="13" height="9"/><rect class="fill" x=".5" y=".5" width="4.5" height="9"/></svg><span class="label-text">Patterns</span><kbd>P</kbd></button>
    <div id="encbar" class="encbar" role="toolbar" aria-label="What the canvas shows"></div>
    <button type="button" class="edge right" data-panel="right" aria-label="Inspect" title="Inspect the selected row or close" aria-keyshortcuts="I" disabled><span class="label-text">Inspect</span><kbd>I</kbd><svg class="side-icon" width="14" height="10" aria-hidden="true"><rect x=".5" y=".5" width="13" height="9"/><rect class="fill" x="9" y=".5" width="4.5" height="9"/></svg></button>
  </div>
  <div class="work">
    <aside id="left" class="side" aria-label="Patterns" hidden></aside>
    <div class="main">
      <section id="canvas" class="canvas" aria-label="Pattern canvas">
        <div class="axis row3"><div class="lab"><span id="rowlabel" class="note"></span><span id="pager" class="pagerbar"></span></div><div id="axis"></div><div id="trackhead" class="cols label"></div></div>
        <div id="lanes"><div class="cursor" id="cursor"></div><div class="tip" id="tip"></div>
          <div id="boot" class="boot" role="status"><span class="label">Loading</span><span id="boot-text">Starting the Filang engine…</span></div></div>
        <div id="busy" class="busy" role="status" hidden></div>
        <div id="toast" class="toast" role="status" hidden></div>
        <div class="band row3">
          <label class="cell"><span class="plus" aria-hidden="true">+</span><input id="add" type="text" autocomplete="off" spellcheck="false" aria-label="Add a condition" placeholder="Add a condition" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="add-list" disabled></label>
          <div id="coltrack"></div>
          <div id="collabel" class="lab"></div>
        </div>
      </section>
      <nav id="dock" class="dock" aria-label="Drawer">
        <button type="button" data-panel="cases" title="Recorded closes of the selected row" aria-keyshortcuts="C" disabled>Cases<kbd>C</kbd></button>
        <button type="button" data-panel="tape" title="The recorded tape" aria-keyshortcuts="T" disabled>Tape<kbd>T</kbd></button>
        <button type="button" data-panel="query" title="The question as Filang text, editable" aria-keyshortcuts="F" disabled>Filang<kbd>F</kbd></button>
        <button type="button" data-panel="limen" title="Hand this question to Limen" aria-keyshortcuts="L" disabled>Limen<kbd>L</kbd></button>
        <button type="button" class="keys-hint" data-keys="sheet" title="Every key the bench answers to" aria-keyshortcuts="?">Keys<kbd>?</kbd></button>
      </nav>
      <section id="drawer" class="drawer" hidden></section>
    </div>
    <aside id="right" class="side right" aria-label="Inspect" hidden></aside>
  </div>
  <footer class="foot">
    <span id="chip"></span>
    <span class="keys">
      <span class="key"><svg width="9" height="14"><line x1="4.5" x2="4.5" y1="0" y2="14" style="stroke:var(--t2)"/><rect x="1.5" y="3.5" width="6" height="6" style="fill:var(--surface);stroke:var(--t2)"/></svg>Median candle, up</span>
      <span class="key"><svg width="9" height="14"><line x1="4.5" x2="4.5" y1="0" y2="14" style="stroke:var(--t2)"/><rect x="1.5" y="3.5" width="6" height="6" style="fill:var(--t2);stroke:var(--t2)"/></svg>Down</span>
      <span class="key"><svg width="16" height="10"><rect width="16" height="10" fill-opacity=".14" style="fill:var(--tint)"/></svg>Middle half of closes</span>
      <span class="key"><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke-dasharray="2 4" style="stroke:var(--t2)"/></svg>Anchor close</span>
      <span class="key"><svg width="8" height="6"><path d="M0 0H8L4 6Z" style="fill:var(--t2)"/></svg>Measured horizon</span>
    </span>
    <span id="status"></span>
  </footer>
  <script type="module">
    // The bench answers nothing without the engine: a page that cannot load it says so.
    import('/bench/bench.js').catch((e) => {
      console.error(e); const s = document.getElementById('status'); s.textContent = 'The bench could not start: ' + e.message; s.className = 'err';
      const boot = document.getElementById('boot'); if (boot) { boot.classList.add('err'); boot.querySelector('.label').textContent = 'Stopped'; document.getElementById('boot-text').textContent = 'The bench could not start: ' + e.message + '. Reload the page to try again.'; }
    });
  </script>
</body>
</html>
