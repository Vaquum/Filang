# Query on the Origo host: host network, serving on 127.0.0.1:8493 only, for the host's Caddy (deployed from
# Vaquum/Portal) to put query.vaquum.fi in front of it behind the Portal login. It has no login of its own and
# keeps no state: the recording is built into the image and every query runs in the reader's browser.
# The port is 8493, not 8491: on this host 8491 is Cube's field-data service.
name: query
services:
  query:
    build:
      context: ..
      dockerfile: query/Dockerfile
    image: query:latest
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "8493"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8493/healthz').then((r) => r.json()).then((b) => process.exit(b.service === 'filang-query' && b.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
