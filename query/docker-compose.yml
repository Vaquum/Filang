# Query on the Origo host: host network, serving on 127.0.0.1:8493 only, for the host's Caddy (deployed from
# Vaquum/Portal) to put query.vaquum.fi in front of it behind the Portal login. It has no login of its own and
# keeps no state: the recording and the shared Filang engine are built into the image and every query runs in the
# reader's browser, on that engine.
# Its bars come from the market-state cube through Cube's bridge on this host's loopback (Vaquum/Cube serves it
# on 127.0.0.1:8487), read only. If the bridge does not answer, the bench shows the built-in recording and says so.
# Its NYSE calendar for those bars comes from field-data-api on this host's loopback (Vaquum/field-data-api, the
# service Cube reads its calendar from, on 127.0.0.1:8491), read only. If it does not answer, cube windows use the
# engine's pinned table and the Limen drawer says why.
# The port is 8493, not 8491: on this host 8491 is Cube's field-data service.
name: query
services:
  query:
    build:
      context: ..
      dockerfile: query/Dockerfile
      args:
        # The published Filang release whose browser package the bench runs on (github.com/Vaquum/Filang/releases).
        FILANG_ENGINE_VERSION: "0.10.0.post32"
    image: query:latest
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "8493"
      CUBE_URL: http://127.0.0.1:8487
      FIELD_DATA_URL: http://127.0.0.1:8491
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8493/healthz').then((r) => r.json()).then((b) => process.exit(b.service === 'filang-query' && b.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
